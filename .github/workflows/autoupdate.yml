name: autoupdate
on:
  workflow_dispatch: # on button click
    inputs:
      version:
        description: 'The version of the smithy-cli to be released (e.g. 1.47.0)'
        required: true
        type: string
      artifact_ext:
        description: 'The file extension of the artifacts (e.g. .zip or .tar.gz)'
        default: .zip
        type: string

permissions:
  contents: read

env:
  release_prefix: https://github.com/smithy-lang/smithy/releases/download
  version: ${{ github.event.inputs.version }}
  artifact_ext: ${{ github.event.inputs.artifact_ext }}
  # <release artifact platform> <bottle.sha256 key>
  platforms: |-
    darwin-x86_64  sierra
    darwin-aarch64 arm64_big_sur
    linux-x86_64   linux
    linux-aarch64  linux_arm

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout bottle repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'main'
          token: "${{ secrets.PR_TOKEN }}"
      - name: Update bottle config
        run: |
          # Fail on any error, unset variable, or failure inside a pipe (e.g. curl | cut).
          set -euo pipefail

          # Reject malformed inputs up front with a clear message instead of a curl 404.
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: '$version'"; exit 2; }
          [[ $artifact_ext =~ ^\.(zip|tar\.gz)$ ]] || { echo "invalid artifact_ext: '$artifact_ext'"; exit 2; }

          config=bottle-configs/smithy-cli.json

          # Fetch every checksum before touching the config, collecting them as jq --arg pairs.
          shas=()
          while read -r platform key; do
            hash_url="$release_prefix/$version/smithy-cli-$platform$artifact_ext.sha256"
            echo "$hash_url"

            # The .sha256 file is "<hash>  <filename>"; keep the hash.
            sha=$(curl -fsSL "$hash_url" | cut -d " " -f1)
            [[ $sha =~ ^[0-9a-f]{64}$ ]] || { echo "invalid sha256 from $hash_url: '$sha'"; exit 2; }
            shas+=(--arg "$key" "$sha")
          done <<< "$platforms"

          # Set version and root_url, and merge the named checksums into .bottle.sha256.
          # jq can't edit in place, so write to a temp file and move it over.
          tmp=$(mktemp)
          jq "${shas[@]}" '
            .version = env.version
            | .bottle.root_url = "\(env.release_prefix)/\(env.version)/smithy-cli"
            | .bottle.sha256 += $ARGS.named
          ' "$config" > "$tmp"
          mv "$tmp" "$config"

          # Show the change in the job log.
          git diff
      - name: Push updates
        run: |
          git config user.name 'smithy-automation'
          git config user.email 'github-smithy-automation@amazon.com'
          git add bottle-configs/smithy-cli.json
          git commit -m "chore: upgrade smithy-cli to $version"
          git push
